<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElCafé Capital | API</title>
    <link rel="icon" href="/brand/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Manuale:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-active">
    <div id="particles-js"></div>

    <header class="navbar">
        <a href="/" class="logo">
            <img src="/brand/logo.png" alt="ElCafé" class="logo-icon">
            <div class="logo-text">
                <span class="bold">ElCafé</span><span class="thin">Capital</span>
            </div>
        </a>
        <div id="user-status" class="hidden">
            <div class="user-pill">
                <span id="user-email-display"></span>
                <button id="logout-btn">Cerrar Sesión</button>
            </div>
        </div>
    </header>

    <main class="viewport">
        <!-- Auth View -->
        <div id="login-container" class="auth-wrapper">
            <div class="bento-card auth-card">
                <div class="card-header">
                    <span class="tag">ACCESO SEGURO</span>
                    <h1>Inicio de Sesión Terminal</h1>
                    <p>Ingrese credenciales institucionales</p>
                </div>

                <div class="login-form">
                    <input type="email" id="email" placeholder="Dirección de correo" required>
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <button id="login-btn" class="pill-btn primary">
                        <span>Autenticar</span>
                        <svg viewBox="0 0 24 24" width="16" height="16">
                            <path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
                        </svg>
                    </button>
                    <div id="login-error" class="error-msg"></div>
                </div>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-container" class="dashboard-grid hidden">
            <!-- Main Key Card -->
            <div class="bento-card key-card">
                <div class="card-header">
                    <span class="tag">ACCESO API</span>
                    <h2>Clave de Simulación</h2>
                </div>
                <div class="key-display-pill">
                    <code id="api-key-display">•••• •••• •••• ••••</code>
                    <button id="copy-btn" class="icon-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor"
                                d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                        </svg>
                    </button>
                </div>
                <div class="card-footer">
                    <button id="generate-btn" class="pill-btn secondary">
                        <span>Regenerar Clave</span>
                    </button>
                    <button id="delete-btn" class="pill-btn danger">
                        <svg viewBox="0 0 24 24" width="16" height="16">
                            <path fill="currentColor"
                                d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                        </svg>
                        <span>Revocar Clave</span>
                    </button>
                    <p class="hint">Una clave activa por cuenta.</p>
                </div>
            </div>

            <!-- Stats & Info -->
            <div class="bento-card stat-card">
                <span class="tag">LÍMITE</span>
                <div class="big-stat">60<small>req/h</small></div>
            </div>

            <div class="bento-card stat-card">
                <span class="tag">ESTADO</span>
                <div class="status-pill active">
                    <span class="dot"></span>
                    Operativo
                </div>
            </div>

            <div class="bento-card help-card">
                <span class="tag">DOCUMENTACIÓN</span>
                <p>Use la cabecera <code>X-API-Key</code> para todas las solicitudes.</p>
                <a href="/docs" class="text-link">Ver Docs de API →</a>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
